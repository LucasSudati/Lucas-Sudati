<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
<defs>
  <linearGradient id="line" x1="0" x2="1"><stop stop-color="#1f6feb"/><stop offset=".5" stop-color="#58a6ff"/><stop offset="1" stop-color="#1f6feb"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
 text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
 .wire{fill:none;stroke:#30363d;stroke-width:2}
 .signal{fill:none;stroke:url(#line);stroke-width:3;stroke-linecap:round;stroke-dasharray:10 90;animation:flow 3.2s linear infinite;filter:url(#glow)}
 .slow{animation-duration:5.2s}.fast{animation-duration:2.3s}
 .ring{fill:none;stroke:#30363d;stroke-width:2;transform-origin:450px 165px;animation:spin 18s linear infinite}
 .ring2{animation-direction:reverse;animation-duration:12s}
 .pulse{animation:pulse 2s ease-in-out infinite}
 .blink{animation:blink 1.3s steps(2,end) infinite}
 @keyframes flow{to{stroke-dashoffset:-100}}
 @keyframes spin{to{transform:rotate(360deg)}}
 @keyframes pulse{50%{opacity:.35}}
 @keyframes blink{50%{opacity:.15}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="900" height="330" rx="18" fill="#0d1117"/>
<g opacity=".55">
 <path class="wire" d="M35 82H180L225 127H330"/>
 <path class="wire" d="M35 247H180L225 202H330"/>
 <path class="wire" d="M565 127H675L720 82H865"/>
 <path class="wire" d="M565 202H675L720 247H865"/>
 <path class="wire" d="M100 165H300"/>
 <path class="wire" d="M600 165H800"/>
</g>
<g>
 <path class="signal" d="M35 82H180L225 127H330"/>
 <path class="signal slow" d="M35 247H180L225 202H330"/>
 <path class="signal fast" d="M565 127H675L720 82H865"/>
 <path class="signal slow" d="M565 202H675L720 247H865"/>
 <path class="signal fast" d="M100 165H300"/>
 <path class="signal" d="M600 165H800"/>
</g>
<circle class="ring" cx="450" cy="165" r="105" stroke-dasharray="22 11"/>
<circle class="ring ring2" cx="450" cy="165" r="88" stroke-dasharray="4 13"/>
<circle cx="450" cy="165" r="67" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
<circle class="pulse" cx="450" cy="165" r="62" fill="none" stroke="#1f6feb"/>
<image href="https://raw.githubusercontent.com/LucasSudati/LucasSudati/main/assets/ls-icon.png" x="390" y="105" width="120" height="120" preserveAspectRatio="xMidYMid meet"/>
<g fill="#8b949e" font-size="11">
 <text x="42" y="69">λ / INPUT</text><text x="42" y="269">Σ / LOGIC</text>
 <text x="858" y="69" text-anchor="end">MEM / 0xLS</text><text x="858" y="269" text-anchor="end">OUT / ∞</text>
</g>
<g fill="#58a6ff">
 <circle cx="180" cy="82" r="4" class="blink"/><circle cx="180" cy="247" r="4" class="pulse"/>
 <circle cx="720" cy="82" r="4" class="pulse"/><circle cx="720" cy="247" r="4" class="blink"/>
 <circle cx="100" cy="165" r="4"/><circle cx="800" cy="165" r="4"/>
</g>
<text x="450" y="306" text-anchor="middle" fill="#8b949e" font-size="10" letter-spacing="2">MATHEMATICS // COMPUTATION // ENGINEERING</text>
</svg>