<path class="ctl" d="M405 161H370V66H348M523 161H555V320H103V308M464 192V330H821V233"/>
<path class="sig" d="M289 97V130"><animate attributeName="stroke-dashoffset" from="0" to="-180" dur=".25s" repeatCount="indefinite"/></path>
<path class="sig" d="M178 161H230"><animate attributeName="stroke-dashoffset" from="0" to="-180" dur=".22s" repeatCount="indefinite"/></path>
<path class="sig" d="M178 256H230"><animate attributeName="stroke-dashoffset" from="0" to="-180" dur=".20s" repeatCount="indefinite"/></path>
<path class="sig" d="M348 161H405"><animate attributeName="stroke-dashoffset" from="0" to="-180" dur=".19s" repeatCount="indefinite"/></path>
<path class="sig" d="M348 256H555V209H587"><animate attributeName="stroke-dashoffset" from="0" to="-280" dur=".32s" repeatCount="indefinite"/></path>
<path class="sig" d="M659 131V165"><animate attributeName="stroke-dashoffset" from="0" to="-180" dur=".18s" repeatCount="indefinite"/></path>
<path class="sig" d="M731 209H770"><animate attributeName="stroke-dashoffset" from="0" to="-180" dur=".21s" repeatCount="indefinite"/></path>

