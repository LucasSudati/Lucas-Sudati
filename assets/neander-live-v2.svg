<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410">
<defs>
 <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
 text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
 .box{fill:#161b22;stroke:#30363d;stroke-width:1.5}.lbl{fill:#8b949e;font-size:10px;letter-spacing:1px}.v{fill:#58a6ff;font-size:14px;font-weight:700}
 .wire{fill:none;stroke:#30363d;stroke-width:2}.ctl{fill:none;stroke:#484f58;stroke-width:1.3;stroke-dasharray:3 6}
 .sig{fill:none;stroke:#58a6ff;stroke-width:3;stroke-linecap:round;stroke-dasharray:8 35;filter:url(#g)}
 .dim{fill:#8b949e;font-size:10px}.on{fill:#58a6ff}.phase{fill:#58a6ff;font-size:11px;font-weight:700}
</style>
<rect width="900" height="410" rx="18" fill="#0d1117"/>

<!-- memory -->
<rect class="box" x="28" y="78" width="150" height="230" rx="10"/>
<text class="lbl" x="103" y="102" text-anchor="middle">MEM / 256 × 8</text>
<g class="dim">
 <text x="45" y="130">00</text><text x="75" y="130">LDA F0</text>
 <text x="45" y="151">02</text><text x="75" y="151">ADD F1</text>
 <text x="45" y="172">04</text><text x="75" y="172">STA F0</text>
 <text x="45" y="193">06</text><text x="75" y="193">JMP 00</text>
 <text x="45" y="237">F0</text><text x="45" y="267">F1</text>
</g>
<text class="v" x="78" y="237">05<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.48;.481;1" dur="8s" repeatCount="indefinite"/></text>
<text class="v" x="78" y="237" opacity="0">06<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.48;.481;1" dur="8s" repeatCount="indefinite"/></text>
<text class="v" x="78" y="267">01</text>

<!-- registers -->
<g>
 <rect class="box" x="230" y="35" width="118" height="62" rx="9"/><text class="lbl" x="289" y="56" text-anchor="middle">PC</text>
 <text class="v" x="289" y="81" text-anchor="middle">00<animate attributeName="opacity" values="1;1;0;0;0;0;0;1" keyTimes="0;.18;.181;.49;.491;.78;.781;1" dur="8s" repeatCount="indefinite"/></text>
 <text class="v" x="289" y="81" text-anchor="middle" opacity="0">02<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.18;.181;.38;.381;1" dur="8s" repeatCount="indefinite"/></text>
 <text class="v" x="289" y="81" text-anchor="middle" opacity="0">04<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.38;.381;.58;.581;1" dur="8s" repeatCount="indefinite"/></text>
 <text class="v" x="289" y="81" text-anchor="middle" opacity="0">06<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.58;.581;.78;.781" dur="8s" repeatCount="indefinite"/></text>

 <rect class="box" x="230" y="130" width="118" height="62" rx="9"/><text class="lbl" x="289" y="151" text-anchor="middle">REM / MAR</text>
 <text class="v" x="289" y="176" text-anchor="middle">00<animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;.18;.181;.58;.78;1" dur="8s" repeatCount="indefinite"/></text>
 <text class="v" x="289" y="176" text-anchor="middle" opacity="0">F0<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.18;.181;.30;.301;1" dur="8s" repeatCount="indefinite"/></text>
 <text class="v" x="289" y="176" text-anchor="middle" opacity="0">F1<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.38;.381;.49;.491;1" dur="8s" repeatCount="indefinite"/></text>
 <text class="v" x="289" y="176" text-anchor="middle" opacity="0">04<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.49;.491;.58;.581;1" dur="8s" repeatCount="indefinite"/></text>

 <rect class="box" x="230" y="225" width="118" height="62" rx="9"/><text class="lbl" x="289" y="246" text-anchor="middle">RDM / MDR</text>
 <text class="v" x="289" y="271" text-anchor="middle">20 / 05<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.30;.301;1" dur="8s" repeatCount="indefinite"/></text>
 <text class="v" x="289" y="271" text-anchor="middle" opacity="0">30 / 01<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.30;.301;.49;.491;1" dur="8s" repeatCount="indefinite"/></text>
 <text class="v" x="289" y="271" text-anchor="middle" opacity="0">10 / 06<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.49;.491;.68;.681" dur="8s" repeatCount="indefinite"/></text>
</g>

<!-- IR + control -->
<rect class="box" x="405" y="35" width="118" height="62" rx="9"/><text class="lbl" x="464" y="56" text-anchor="middle">RI / IR</text>
<text class="v" x="464" y="81" text-anchor="middle">LDA<animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;.30;.301;.78;.90;1" dur="8s" repeatCount="indefinite"/></text>
<text class="v" x="464" y="81" text-anchor="middle" opacity="0">ADD<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.30;.301;.49;.491;1" dur="8s" repeatCount="indefinite"/></text>
<text class="v" x="464" y="81" text-anchor="middle" opacity="0">STA<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.49;.491;.68;.681;1" dur="8s" repeatCount="indefinite"/></text>
<text class="v" x="464" y="81" text-anchor="middle" opacity="0">JMP<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.68;.681;.90;.901;1" dur="8s" repeatCount="indefinite"/></text>

<rect class="box" x="405" y="130" width="118" height="62" rx="9"/><text class="lbl" x="464" y="151" text-anchor="middle">UC / CONTROL</text>
<text class="phase" x="464" y="176" text-anchor="middle">FETCH<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.12;.121;.82;1" dur="2s" repeatCount="indefinite"/></text>
<text class="phase" x="464" y="176" text-anchor="middle" opacity="0">DECODE<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.12;.121;.42;.421" dur="2s" repeatCount="indefinite"/></text>
<text class="phase" x="464" y="176" text-anchor="middle" opacity="0">EXECUTE<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.42;.421;.82;.821" dur="2s" repeatCount="indefinite"/></text>

<!-- AC ALU flags -->
<rect class="box" x="600" y="55" width="118" height="76" rx="10"/><text class="lbl" x="659" y="78" text-anchor="middle">AC / 8 BIT</text>
<text class="v" x="659" y="108" text-anchor="middle">00000101<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.38;.381;.90;1" dur="8s" repeatCount="indefinite"/></text>
<text class="v" x="659" y="108" text-anchor="middle" opacity="0">00000110<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.38;.381;.90;.901" dur="8s" repeatCount="indefinite"/></text>

<path d="M659 165l72 44-72 44-72-44z" fill="#161b22" stroke="#58a6ff" stroke-width="1.7"/>
<text class="lbl" x="659" y="202" text-anchor="middle">ULA / ALU</text><text class="v" x="659" y="225" text-anchor="middle">ADD</text>

<rect class="box" x="770" y="145" width="102" height="88" rx="10"/><text class="lbl" x="821" y="168" text-anchor="middle">FLAGS</text>
<text class="v" x="821" y="195" text-anchor="middle">N 0</text><text class="v" x="821" y="218" text-anchor="middle">Z 0</text>

